server {
    listen 80;
    server_name _;

    root /opt/packet-parser/dist;
    index index.html;

    # 访问日志 - 记录所有请求
    access_log /var/log/nginx/packet-parser-access.log;

    # 统计接口 - 返回 204，只记录日志
    location /api/parse {
        return 204;
    }

    # 静态资源
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 字体文件
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 协议 JSON 文件
    location /protocols/ {
        expires 1d;
    }

    # 单页应用路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
